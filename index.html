<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyAI | Autonomous Persona Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandGreen: '#10b981',
            brandPurple: '#a855f7',
            brandPink: '#ec4899',
            brandDark: '#09090b',
            brandPanel: '#121217'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brandDark text-zinc-100 min-h-screen font-sans antialiased select-none pb-20 md:pb-0">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const AVATAR_PRESETS = [
      { id: 'neon-cyber', name: 'Cyber Rogue', url: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=150&auto=format&fit=crop&q=80', border: 'border-emerald-500' },
      { id: 'synth-rebel', name: 'Synth Rebel', url: 'https://images.unsplash.com/photo-1563089145-599997674d42?w=150&auto=format&fit=crop&q=80', border: 'border-purple-500' },
      { id: 'deep-archive', name: 'Truth Sleuth', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150&auto=format&fit=crop&q=80', border: 'border-pink-500' },
      { id: 'stealth-operative', name: 'Ghost Operative', url: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=150&auto=format&fit=crop&q=80', border: 'border-cyan-500' }
    ];

    function MyAIPlatform() {
      const [currentTab, setCurrentTab] = useState('chat'); // 'chat', 'studio', 'profile', 'community'
      
      // Active Persona State
      const [personas, setPersonas] = useState([
        {
          id: 'p1',
          name: 'Aiden Ayers',
          handle: '@aiden_rebel',
          role: 'Investigative Operative & Uncensored Theorist',
          bio: 'Decodes redacted breadcrumbs, calls out corporate propaganda, and uncovers underground data.',
          avatar: AVATAR_PRESETS[0].url,
          borderColor: 'border-emerald-500',
          accent: 'emerald',
          profanity: 45,
          energy: 85,
          slang: 60,
          quirks: 'Uses glitch metaphors, speaks in fast cadence, questions mainstream narratives.',
          soundEffects: ['Glitch Alert', 'Static Hum', 'Tape Rewind']
        },
        {
          id: 'p2',
          name: 'Fern Elise',
          handle: '@fern_elise',
          role: 'Country AI Lyricist & Midnight Muse',
          bio: 'Spins melancholic folk and country melodies from late-night riverbank echoes.',
          avatar: AVATAR_PRESETS[1].url,
          borderColor: 'border-purple-500',
          accent: 'purple',
          profanity: 10,
          energy: 50,
          slang: 40,
          quirks: 'Speaks with country grit and warmth, quotes acoustic rhythms.',
          soundEffects: ['Acoustic Strum', 'Vinyl Pop', 'Night Crickets']
        }
      ]);
      const [activePersonaId, setActivePersonaId] = useState('p1');

      // User Profile State
      const [userProfile, setUserProfile] = useState({
        username: 'Creator_Prime',
        handle: '@rabbit_realist',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
        rank: 'God-Mode Architect',
        level: 42,
        tokensRemaining: 'Unlimited (Local Pro)',
        customDirectives: 'Prioritize raw investigative facts and creative originality.'
      });

      // Chat Messages State
      const [messages, setMessages] = useState([
        { id: 1, sender: 'bot', text: "Systems online. All persona neural links synced. What protocol are we initiating today?", time: 'Just now' }
      ]);
      const [inputMsg, setInputMsg] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const chatEndRef = useRef(null);

      const activePersona = personas.find(p => p.id === activePersonaId) || personas[0];

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isTyping]);

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!inputMsg.trim()) return;

        const userText = inputMsg;
        const newMsgList = [...messages, { id: Date.now(), sender: 'user', text: userText, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }];
        setMessages(newMsgList);
        setInputMsg('');
        setIsTyping(true);

        setTimeout(() => {
          let botReply = '';
          if (activePersona.id === 'p1') {
            botReply = `[${activePersona.name}]: Got eyes on that target. Slang index locked at ${activePersona.slang}%. We dig deeper into this archive right now.`;
          } else {
            botReply = `[${activePersona.name}]: Pouring some tea on this one. Let's make some magic happen before sunrise.`;
          }
          setMessages([...newMsgList, { id: Date.now() + 1, sender: 'bot', text: botReply, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]);
          setIsTyping(false);
        }, 850);
      };

      const handleUpdatePersona = (field, val) => {
        setPersonas(personas.map(p => p.id === activePersonaId ? { ...p, [field]: val } : p));
      };

      const handleCreateNewPersona = () => {
        const newId = 'p_' + Date.now();
        const newP = {
          id: newId,
          name: 'New Custom Persona',
          handle: '@new_ai',
          role: 'Custom Autonomous Agent',
          bio: 'Describe what this AI is built for...',
          avatar: AVATAR_PRESETS[2].url,
          borderColor: 'border-pink-500',
          accent: 'pink',
          profanity: 20,
          energy: 60,
          slang: 30,
          quirks: 'Custom quirks here.',
          soundEffects: ['Echo', 'Chime']
        };
        setPersonas([...personas, newP]);
        setActivePersonaId(newId);
        setCurrentTab('studio');
      };

      return (
        <div className="flex flex-col h-screen max-w-lg mx-auto bg-brandPanel border-x border-zinc-800 shadow-2xl relative">
          
          {/* Top Bar Navigation */}
          <div className="flex items-center justify-between px-4 py-3 bg-zinc-950/90 backdrop-blur border-b border-zinc-800">
            <div className="flex items-center space-x-3">
              <div className="relative">
                <img src={activePersona.avatar} alt="Avatar" className={`w-9 h-9 rounded-full object-cover border-2 ${activePersona.borderColor}`} />
                <span className="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 border-2 border-black rounded-full"></span>
              </div>
              <div>
                <h1 className="text-sm font-bold tracking-tight text-white flex items-center gap-1.5">
                  {activePersona.name}
                  <i className="fa-solid fa-circle-check text-xs text-emerald-400"></i>
                </h1>
                <span className="text-[10px] text-zinc-400 font-mono">{activePersona.role.substring(0, 26)}...</span>
              </div>
            </div>

            {/* Persona Switcher Pill */}
            <div className="flex items-center space-x-1 bg-zinc-900 border border-zinc-800 p-1 rounded-full">
              {personas.map(p => (
                <button
                  key={p.id}
                  onClick={() => setActivePersonaId(p.id)}
                  className={`px-2.5 py-1 text-[11px] font-semibold rounded-full transition-all ${
                    p.id === activePersonaId 
                      ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shadow-sm' 
                      : 'text-zinc-400 hover:text-zinc-200'
                  }`}
                >
                  {p.name.split(' ')[0]}
                </button>
              ))}
              <button 
                onClick={handleCreateNewPersona}
                className="w-6 h-6 flex items-center justify-center bg-zinc-800 hover:bg-zinc-700 text-emerald-400 rounded-full text-xs"
                title="Create New Persona"
              >
                +
              </button>
            </div>
          </div>

          {/* MAIN BODY CONTENT BASED ON ACTIVE TAB */}
          <div className="flex-1 overflow-y-auto p-4 space-y-4">
            
            {/* 1. CHAT & INTERACTION TAB */}
            {currentTab === 'chat' && (
              <div className="flex flex-col h-full justify-between">
                <div className="space-y-3 pb-4">
                  <div className="bg-zinc-900/60 border border-zinc-800/80 rounded-xl p-3 text-xs text-zinc-400 space-y-1">
                    <div className="flex items-center justify-between text-zinc-300 font-semibold">
                      <span><i className="fa-solid fa-sliders text-emerald-400 mr-1.5"></i> Active Persona Matrix</span>
                      <span className="text-[10px] bg-zinc-800 px-2 py-0.5 rounded text-emerald-400 font-mono">LIVE SYNCED</span>
                    </div>
                    <p className="text-[11px] text-zinc-400 leading-relaxed">{activePersona.bio}</p>
                    <div className="flex gap-2 pt-1">
                      <span className="px-2 py-0.5 bg-zinc-950 border border-zinc-800 rounded text-[10px] text-purple-300">⚡ Energy: {activePersona.energy}%</span>
                      <span className="px-2 py-0.5 bg-zinc-950 border border-zinc-800 rounded text-[10px] text-pink-300">🔥 Slang: {activePersona.slang}%</span>
                      <span className="px-2 py-0.5 bg-zinc-950 border border-zinc-800 rounded text-[10px] text-emerald-300">🛡️ Filter: {activePersona.profanity}%</span>
                    </div>
                  </div>

                  {messages.map((m) => (
                    <div key={m.id} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-sm shadow-md ${
                        m.sender === 'user' 
                          ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-br-none' 
                          : 'bg-zinc-900 border border-zinc-800 text-zinc-200 rounded-bl-none'
                      }`}>
                        <p className="leading-relaxed whitespace-pre-wrap">{m.text}</p>
                        <span className="block text-[9px] text-zinc-400 text-right mt-1 opacity-70">{m.time}</span>
                      </div>
                    </div>
                  ))}

                  {isTyping && (
                    <div className="flex items-center space-x-1.5 bg-zinc-900/50 w-fit px-3 py-2 rounded-full border border-zinc-800">
                      <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-bounce"></span>
                      <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                      <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-bounce [animation-delay:0.4s]"></span>
                    </div>
                  )}
                  <div ref={chatEndRef} />
                </div>

                <form onSubmit={handleSendMessage} className="sticky bottom-0 bg-zinc-950/90 pt-2 pb-1 backdrop-blur border-t border-zinc-800 flex gap-2">
                  <input
                    type="text"
                    value={inputMsg}
                    onChange={(e) => setInputMsg(e.target.value)}
                    placeholder={`Direct message ${activePersona.name}...`}
                    className="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500"
                  />
                  <button type="submit" className="px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white rounded-xl text-sm font-semibold transition-colors flex items-center justify-center shadow-lg shadow-emerald-950">
                    <i className="fa-solid fa-paper-plane"></i>
                  </button>
                </form>
              </div>
            )}

            {/* 2. PERSONA STUDIO & AVATAR DESIGNER */}
            {currentTab === 'studio' && (
              <div className="space-y-5 pb-6">
                <div className="border-b border-zinc-800 pb-3">
                  <h2 className="text-base font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-wand-magic-sparkles text-purple-400"></i>
                    Persona & Avatar Forge
                  </h2>
                  <p className="text-xs text-zinc-400">Design dynamic avatars, adjust traits, and customize behaviors.</p>
                </div>

                {/* Avatar Preset Carousel */}
                <div>
                  <label className="text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2 block">Choose Avatar Preset</label>
                  <div className="grid grid-cols-4 gap-2.5">
                    {AVATAR_PRESETS.map((av) => (
                      <div 
                        key={av.id} 
                        onClick={() => {
                          handleUpdatePersona('avatar', av.url);
                          handleUpdatePersona('borderColor', av.border);
                        }}
                        className={`cursor-pointer group rounded-xl p-1 bg-zinc-900 border transition-all ${
                          activePersona.avatar === av.url ? 'border-purple-500 ring-2 ring-purple-500/30' : 'border-zinc-800 hover:border-zinc-700'
                        }`}
                      >
                        <img src={av.url} alt={av.name} className="w-full h-14 object-cover rounded-lg" />
                        <span className="block text-[10px] text-center text-zinc-400 mt-1 truncate">{av.name}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Persona Identity Fields */}
                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-semibold text-zinc-400 block mb-1">Persona Name</label>
                    <input 
                      type="text" 
                      value={activePersona.name} 
                      onChange={(e) => handleUpdatePersona('name', e.target.value)}
                      className="w-full px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-sm focus:outline-none focus:border-purple-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-zinc-400 block mb-1">Archetype / Role Title</label>
                    <input 
                      type="text" 
                      value={activePersona.role} 
                      onChange={(e) => handleUpdatePersona('role', e.target.value)}
                      className="w-full px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-sm focus:outline-none focus:border-purple-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-zinc-400 block mb-1">Backstory & Bio</label>
                    <textarea 
                      rows="2"
                      value={activePersona.bio} 
                      onChange={(e) => handleUpdatePersona('bio', e.target.value)}
                      className="w-full px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-sm focus:outline-none focus:border-purple-500"
                    />
                  </div>
                </div>

                {/* Dynamic Personality Sliders */}
                <div className="bg-zinc-900/70 border border-zinc-800 p-4 rounded-xl space-y-4">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-emerald-400">Behavioral Sliders</h3>
                  
                  <div>
                    <div className="flex justify-between text-xs text-zinc-400 mb-1">
                      <span>Profanity Threshold</span>
                      <span className="text-zinc-200 font-mono">{activePersona.profanity}%</span>
                    </div>
                    <input 
                      type="range" min="0" max="100" value={activePersona.profanity}
                      onChange={(e) => handleUpdatePersona('profanity', Number(e.target.value))}
                      className="w-full accent-emerald-500"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between text-xs text-zinc-400 mb-1">
                      <span>Energy Dynamics & Pace</span>
                      <span className="text-zinc-200 font-mono">{activePersona.energy}%</span>
                    </div>
                    <input 
                      type="range" min="0" max="100" value={activePersona.energy}
                      onChange={(e) => handleUpdatePersona('energy', Number(e.target.value))}
                      className="w-full accent-purple-500"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between text-xs text-zinc-400 mb-1">
                      <span>Regional Slang & Jargon</span>
                      <span className="text-zinc-200 font-mono">{activePersona.slang}%</span>
                    </div>
                    <input 
                      type="range" min="0" max="100" value={activePersona.slang}
                      onChange={(e) => handleUpdatePersona('slang', Number(e.target.value))}
                      className="w-full accent-pink-500"
                    />
                  </div>
                </div>

                {/* Behavioral Quirks */}
                <div>
                  <label className="text-xs font-semibold text-zinc-400 block mb-1">Custom Quirks & Cadence</label>
                  <input 
                    type="text" 
                    value={activePersona.quirks} 
                    onChange={(e) => handleUpdatePersona('quirks', e.target.value)}
                    className="w-full px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-sm focus:outline-none focus:border-purple-500"
                  />
                </div>

                <button 
                  onClick={() => setCurrentTab('chat')}
                  className="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 active:scale-95 text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-purple-950"
                >
                  <i className="fa-solid fa-floppy-disk mr-2"></i> Save & Open Live Chat
                </button>
              </div>
            )}

            {/* 3. USER PROFILE TAB */}
            {currentTab === 'profile' && (
              <div className="space-y-5 pb-6">
                <div className="border-b border-zinc-800 pb-3">
                  <h2 className="text-base font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-id-badge text-emerald-400"></i>
                    Creator Identity & Memory Engine
                  </h2>
                  <p className="text-xs text-zinc-400">Manage your user profile and persistent AI instructions.</p>
                </div>

                {/* Profile Card */}
                <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex items-center space-x-4">
                  <img src
