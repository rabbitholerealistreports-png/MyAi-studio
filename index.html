<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyAI Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function PersonaStudio() {
      const [name, setName] = useState("Aiden Ayers");
      const [archetype, setArchetype] = useState("Rebel Truth-Seeker");
      const [profanity, setProfanity] = useState(25);
      const [energy, setEnergy] = useState(70);
      const [slang, setSlang] = useState(50);
      const [quirks, setQuirks] = useState("Speaks in rapid-fire cadence, references underground archives.");
      const [compiledOutput, setCompiledOutput] = useState("");

      const handleCompile = () => {
        const prompt = `[GOD PROMPT: SYSTEM INITIALIZATION]\n` +
          `IDENTITY: ${name || "Unnamed Persona"}\n` +
          `ARCHETYPE: ${archetype || "Standard Assistant"}\n` +
          `BEHAVIORAL MATRICES:\n` +
          `- Profanity Filter: ${profanity}% (${profanity > 50 ? "Uncensored / Gritty" : "Mild / Clean"})\n` +
          `- Energy Dynamics: ${energy}% (${energy > 50 ? "High Intensity / Rapid" : "Calm / Analytical"})\n` +
          `- Regional Slang: ${slang}%\n` +
          `- Custom Quirks: ${quirks || "None specified."}\n\n` +
          `DIRECTIVE: Embody this persona consistently across all conversational turns.`;
        
        setCompiledOutput(prompt);
      };

      return (
        <div className="max-w-md mx-auto p-4 space-y-6">
          <header className="border-b border-zinc-800 pb-4">
            <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
              <span className="inline-block w-3 h-3 rounded-full bg-emerald-500"></span>
              MyAI Studio
            </h1>
            <p className="text-xs text-zinc-400 mt-1">Autonomous Persona Engine</p>
          </header>

          <div className="space-y-4">
            <div>
              <label className="text-xs font-semibold uppercase tracking-wider text-zinc-400">Persona Name</label>
              <input 
                type="text" 
                value={name} 
                onChange={(e) => setName(e.target.value)}
                className="w-full mt-1 px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-sm focus:outline-none focus:border-emerald-500"
              />
            </div>

            <div>
              <label className="text-xs font-semibold uppercase tracking-wider text-zinc-400">Archetype / Role</label>
              <input 
                type="text" 
                value={archetype} 
                onChange={(e) => setArchetype(e.target.value)}
                className="w-full mt-1 px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-sm focus:outline-none focus:border-emerald-500"
              />
            </div>

            <div className="space-y-3 pt-2">
              <div>
                <div className="flex justify-between text-xs text-zinc-400 mb-1">
                  <span>Profanity</span>
                  <span className="text-zinc-200">{profanity}%</span>
                </div>
                <input 
                  type="range" min="0" max="100" value={profanity}
                  onChange={(e) => setProfanity(Number(e.target.value))}
                  className="w-full accent-emerald-500"
                />
              </div>

              <div>
                <div className="flex justify-between text-xs text-zinc-400 mb-1">
                  <span>Energy & Pace</span>
                  <span className="text-zinc-200">{energy}%</span>
                </div>
                <input 
                  type="range" min="0" max="100" value={energy}
                  onChange={(e) => setEnergy(Number(e.target.value))}
                  className="w-full accent-emerald-500"
                />
              </div>

              <div>
                <div className="flex justify-between text-xs text-zinc-400 mb-1">
                  <span>Slang & Idioms</span>
                  <span className="text-zinc-200">{slang}%</span>
                </div>
                <input 
                  type="range" min="0" max="100" value={slang}
                  onChange={(e) => setSlang(Number(e.target.value))}
                  className="w-full accent-emerald-500"
                />
              </div>
            </div>

            <div>
              <label className="text-xs font-semibold uppercase tracking-wider text-zinc-400">Custom Behavioral Quirks</label>
              <textarea 
                rows="3" 
                value={quirks} 
                onChange={(e) => setQuirks(e.target.value)}
                className="w-full mt-1 px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-sm focus:outline-none focus:border-emerald-500"
              ></textarea>
            </div>

            <button 
              onClick={handleCompile}
              className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold rounded-lg text-sm transition-colors shadow-lg shadow-emerald-950"
            >
              Compile God Prompt
            </button>
          </div>

          {compiledOutput && (
            <div className="pt-4 border-t border-zinc-800 space-y-2">
              <label className="text-xs font-semibold uppercase tracking-wider text-emerald-400">Generated System Matrix</label>
              <pre className="p-3 bg-zinc-900 border border-zinc-800 rounded-lg text-xs text-zinc-300 whitespace-pre-wrap font-mono select-all">
                {compiledOutput}
              </pre>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PersonaStudio />);
  </script>
</body>
</html>
